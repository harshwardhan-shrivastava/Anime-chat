# Render Blueprint — deploys Anime-chat (Flask) as a persistent web service.
# The app already honors the $PORT env var and binds 0.0.0.0, so no code
# changes are needed. Background threads (auto-enrichment, schedule refresh)
# run inside the long-lived process.
services:
  - type: web
    name: anime-chat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      # Free Turso database (https://turso.tech) so accounts, history and
      # lists survive redeploys. Fill in from your Turso dashboard:
      #   TURSO_DATABASE_URL = libsql://<your-db>-<org>.turso.io
      #   TURSO_AUTH_TOKEN    = the database token
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Email for the 6-digit verification codes. Gmail SMTP is the
      # primary (SMTP_HOST/SMTP_USER/SMTP_PASS/MAIL_FROM); SENDGRID_API_KEY
      # is a backup that's only used when SMTP is missing or fails.
      # For Gmail, SMTP_PASS is a 16-char App Password (Google account
      # security -> App passwords), not your regular Gmail password.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      # Free key from https://developers.giphy.com for the GIF picker in
      # the chat (threads). Without it the picker errors out.
      - key: GIPHY_API_KEY
        sync: false
