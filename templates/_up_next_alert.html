<!-- ================= SITE-WIDE REMINDER DOCK =================
     Included by _footer.html (and directly by threads.html / otachan.html,
     which roll their own footer), so it exists on every page.

     The bell is a navbar item, not a floating widget: _navbar.html renders an
     empty #unNavSlot and the script below drops the button into that place, so
     it lines up with the burger and the profile pill and inherits the navbar's
     chrome. Pages with no navbar at all (anime, threads, Ota-chan) keep the
     button in the top-right corner instead, and the panel always hangs from
     the top-right of the screen, just under the navbar where one exists.

     The panel is the notification box: one wide, low row per reminder with the
     show's thumbnail, its name and a line of why, every row a link straight to
     that anime. The most recently due reminder is listed first — that is the
     one that just went off — and a reminder that came due in the last ten
     minutes is highlighted, because "which one just fired?" is the question
     the box exists to answer.

     The bell is the constant: it sits in the page header on every page (the
     navbar where there is one, or a page's own #unNavSlot), stays put while the
     box is open, and carries the count of reminders the user has not been
     shown yet — so the number clears once the box has been seen instead of
     claiming "1 unread" forever. Threads keeps its own notification bell
     instead (see threads.html).

     The box opens itself only for a reminder that *just* went off (inside
     FRESH_SECONDS): a stale one popping a box over the page reads as being
     nagged, while the bell and its count already say something is waiting and
     one click shows the whole list. Once open that way it stays until ✕ or
     Escape — it is the notification, not a menu, so clicking the page under it
     must not take the row away. A box opened from the bell is a normal
     drop-down and closes on an outside click.

     Every row carries a ✓: "I got it, I'll watch it" clears the reminder on
     the server (POST /api/up-next/ack) — the timer goes off, the row leaves the
     box and the badge drops — while the show itself stays on the queue, so
     /up-next still lists it for anyone who missed the notification.

     Self-contained on purpose: markup, style and script all live here rather
     than in up_next.css/js, because this partial lands on pages that load
     neither, and the icons are inline SVG so a blocked icon font can never
     leave an empty square where the bell should be. Data comes from
     GET /api/up-next/alerts (up_next.py), which answers 401 when signed out so
     the dock stays silent instead of bouncing a visitor to /login for reading
     a public page. It re-checks every 60s while the tab is visible, so a timer
     that runs out mid-browse pops on its own — nothing to open first.
     -->
<style>
    .un-dock{
        position:fixed;
        /* Top-right of the screen. --un-panel-top is set by the script to the
           navbar's bottom edge (the navbar wraps onto a second row at some
           widths, so measuring beats guessing a breakpoint). */
        top:var(--un-panel-top,16px);
        right:max(14px,2vw);
        z-index:1540;
        display:flex;
        flex-direction:column;
        align-items:flex-end;
        gap:10px;
        font-family:'Montserrat',system-ui,sans-serif;
    }
    .un-dock[hidden]{ display:none; }
    .un-dock .un-svg-bell{ width:20px; height:20px; display:block; }

    /* ---------------- the bell ---------------- */
    /* Only seen on pages with no navbar: there it keeps the accent look and
       sits in the corner. Inside the navbar _navbar.html styles it instead. */
    .un-bell{
        position:relative;
        width:46px;
        height:46px;
        display:inline-flex;
        align-items:center;
        justify-content:center;
        border:none;
        border-radius:14px;
        background:linear-gradient(135deg,#ff9f57,#ff7a2f);
        color:#1a1207;
        cursor:pointer;
        box-shadow:0 10px 26px rgba(0,0,0,.45),0 0 22px rgba(255,122,47,.32);
        transition:transform .2s, filter .2s, box-shadow .2s;
    }
    .un-bell[hidden]{ display:none; }
    .un-bell:hover{
        transform:translateY(-1px);
        filter:brightness(1.06);
        box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 26px rgba(255,122,47,.45);
    }
    .un-bell-count{
        position:absolute;
        top:-6px;
        right:-6px;
        min-width:22px;
        height:22px;
        padding:0 6px;
        box-sizing:border-box;
        border-radius:999px;
        background:#ff3b6b;
        color:#fff;
        font-size:11px;
        font-weight:800;
        line-height:22px;
        text-align:center;
        box-shadow:0 4px 12px rgba(0,0,0,.45);
        animation:unBadgePulse 2.2s ease-out infinite;
    }
    .un-bell-count[hidden]{ display:none; }
    @keyframes unBadgePulse{
        0%   { box-shadow:0 4px 12px rgba(0,0,0,.45),0 0 0 0 rgba(255,59,107,.55); }
        70%  { box-shadow:0 4px 12px rgba(0,0,0,.45),0 0 0 8px rgba(255,59,107,0); }
        100% { box-shadow:0 4px 12px rgba(0,0,0,.45),0 0 0 0 rgba(255,59,107,0); }
    }
    /* Nothing is due yet, only armed: a quiet dot instead of a number, so the
       bell never claims a reminder is ready when it is just ticking. */
    .un-bell-count.quiet{
        min-width:11px;
        width:11px;
        height:11px;
        padding:0;
        font-size:0;
        line-height:0;
        background:#8f5bff;
        animation:none;
    }
    /* A bell mounted in a page's own header (the navbar, or the anime /
       episode / community headers, which leave a #unNavSlot) instead of the
       floating corner: the same chrome as the burger and the profile pill, so
       it reads as part of the header — exactly like the homepage's. */
    .un-bell.in-nav{
        width:42px;
        height:42px;
        flex-shrink:0;
        border-radius:11px;
        border:1px solid rgba(255,255,255,.12);
        background:rgba(255,255,255,.06);
        color:#e7e9f3;
        box-shadow:none;
    }
    .un-bell.in-nav:hover{
        background:rgba(143,91,255,.18);
        border-color:rgba(143,91,255,.45);
        color:#fff;
        transform:none;
        filter:none;
        box-shadow:0 0 16px rgba(143,91,255,.32);
    }
    .un-bell.in-nav .un-svg-bell{ width:19px; height:19px; }
    .un-bell.in-nav .un-bell-count{
        top:-5px;
        right:-5px;
        min-width:19px;
        height:19px;
        line-height:19px;
        font-size:10px;
        padding:0 5px;
    }
    /* An empty seat must not claim a gap's worth of space while the script is
       still parsing, or on the pages where the bell never arrives at all. */
    .nav-bell-slot:empty{ display:none; }

    /* ---------------- the notification box ---------------- */
    .un-panel{
        position:relative;
        width:min(362px,calc(100vw - 28px));
        box-sizing:border-box;
        padding:12px 12px 11px;
        border-radius:18px;
        border:1px solid rgba(255,140,66,.42);
        background:
            linear-gradient(150deg,rgba(255,140,66,.16),rgba(143,91,255,.14)),
            rgba(13,17,28,.97);
        box-shadow:0 20px 46px rgba(0,0,0,.55),0 0 34px rgba(255,140,66,.12);
        backdrop-filter:blur(10px);
        -webkit-backdrop-filter:blur(10px);
    }
    .un-panel[hidden]{ display:none; }
    /* Points back up at the navbar bell, so the box reads as its drop-down. */
    .un-dock.with-nav .un-panel::before{
        content:"";
        position:absolute;
        top:-7px;
        right:22px;
        width:12px;
        height:12px;
        border-top:1px solid rgba(255,140,66,.42);
        border-left:1px solid rgba(255,140,66,.42);
        background:#141826;
        transform:rotate(45deg);
    }
    .un-panel-in{ animation:unPanelIn .3s cubic-bezier(.22,1,.36,1) both; }
    @keyframes unPanelIn{
        from{ opacity:0; transform:translateY(-12px) scale(.98); }
        to  { opacity:1; transform:none; }
    }
    .un-panel-head{
        display:flex;
        align-items:center;
        gap:8px;
        padding-right:26px;
    }
    .un-panel-title{
        color:#ffb27a;
        font-size:11px;
        font-weight:800;
        letter-spacing:1.1px;
        text-transform:uppercase;
        line-height:1.3;
    }
    .un-panel-x{
        position:absolute;
        margin-left:auto;
        top:9px;
        right:9px;
        width:24px;
        height:24px;
        display:flex;
        align-items:center;
        justify-content:center;
        border-radius:8px;
        border:1px solid rgba(255,255,255,.14);
        background:rgba(255,255,255,.05);
        color:#c8cbe0;
        font-size:14px;
        line-height:1;
        cursor:pointer;
        transition:.2s;
    }
    .un-panel-x:hover{ background:rgba(255,255,255,.15); color:#fff; }
    .un-panel-list{
        display:flex;
        flex-direction:column;
        gap:6px;
        margin-top:9px;
        max-height:min(46vh,360px);
        overflow-y:auto;
    }
    .un-group{
        color:#8f94b0;
        font-size:9.5px;
        font-weight:800;
        letter-spacing:1.1px;
        text-transform:uppercase;
        padding:5px 2px 0;
    }
    /* Wide and low: a 38px square thumbnail, one line of show, one line of
       why, the reminder's state, and the ✓ that retires it. The row is a
       container rather than a link because the ✓ has to be a real button
       inside it — a button inside an <a> is invalid and would follow the link
       as well as doing its own job. */
    .un-row{
        display:flex;
        align-items:center;
        gap:8px;
        padding:6px;
        border-radius:12px;
        border:1px solid rgba(255,255,255,.07);
        background:rgba(255,255,255,.05);
        transition:background .2s, border-color .2s, transform .2s;
    }
    .un-row:hover{
        background:rgba(255,140,66,.15);
        border-color:rgba(255,140,66,.45);
        transform:translateX(-2px);
    }
    .un-row-main{
        flex:1 1 auto;
        min-width:0;
        display:flex;
        align-items:center;
        gap:10px;
        text-decoration:none;
    }
    /* "Got it, I'll watch it": the reminder's timer goes off and the row leaves
       the box, while the show itself stays on the queue. */
    .un-row-ack{
        flex:0 0 auto;
        width:28px;
        height:28px;
        display:inline-flex;
        align-items:center;
        justify-content:center;
        border-radius:9px;
        border:1px solid rgba(255,255,255,.14);
        background:rgba(255,255,255,.05);
        color:#c8cbe0;
        cursor:pointer;
        transition:background .2s, border-color .2s, color .2s;
    }
    .un-row-ack svg{ width:14px; height:14px; }
    .un-row-ack:hover{
        border-color:rgba(96,220,140,.55);
        background:rgba(96,220,140,.16);
        color:#8ff0b4;
    }
    .un-row-ack:disabled{ opacity:.55; cursor:default; }
    /* Just went off: the row the user is most likely looking for. */
    .un-row.fresh{
        border-color:rgba(255,140,66,.5);
        background:linear-gradient(120deg,rgba(255,140,66,.18),rgba(143,91,255,.12));
        box-shadow:0 0 18px rgba(255,140,66,.16);
    }
    .un-row-thumb{
        width:38px;
        height:38px;
        flex:0 0 auto;
        border-radius:10px;
        overflow:hidden;
        display:flex;
        align-items:center;
        justify-content:center;
        background:rgba(255,255,255,.08);
        color:#8f94b0;
    }
    .un-row-thumb img{
        width:100%;
        height:100%;
        object-fit:cover;
        display:block;
    }
    .un-row-thumb svg{ width:17px; height:17px; }
    .un-row-text{
        min-width:0;
        flex:1 1 auto;
        display:flex;
        flex-direction:column;
        gap:1px;
    }
    .un-row-text strong{
        color:#fff;
        font-size:12.5px;
        font-weight:700;
        line-height:1.25;
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
    }
    .un-row-text span{
        color:#a9adc4;
        font-size:10.5px;
        font-weight:600;
        line-height:1.3;
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
    }
    .un-row.ready .un-row-text span{ color:#ffb27a; }
    .un-row-pill{
        flex:0 0 auto;
        padding:4px 8px;
        border-radius:999px;
        font-size:9.5px;
        font-weight:800;
        letter-spacing:.6px;
        text-transform:uppercase;
        line-height:1.1;
        white-space:nowrap;
    }
    .un-row-pill.ready{
        background:linear-gradient(135deg,#ff8c42,#ffab5e);
        color:#26140a;
    }
    .un-row-pill.soon{
        border:1px solid rgba(143,91,255,.5);
        background:rgba(143,91,255,.22);
        color:#c9a8ff;
    }
    .un-panel-foot{
        display:flex;
        flex-direction:column;
        gap:7px;
        margin-top:10px;
    }
    /* Only when the lists are cut short: says how many did not fit. */
    .un-more{
        color:#a9adc4;
        font-size:10.5px;
        font-weight:600;
        text-decoration:none;
        padding:0 2px;
    }
    .un-more:hover{ color:#ffb27a; }
    .un-panel-all{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        gap:8px;
        padding:10px 14px;
        border-radius:12px;
        background:linear-gradient(135deg,#ff9f57,#ff7a2f);
        color:#141a26;
        font-size:11px;
        font-weight:800;
        letter-spacing:.7px;
        text-transform:uppercase;
        text-decoration:none;
        transition:.2s;
    }
    .un-panel-all svg{ width:14px; height:14px; }
    .un-panel-all:hover{
        box-shadow:0 0 20px rgba(255,140,66,.55);
        transform:translateY(-1px);
        color:#141a26;
    }
    /* Shown only when this device has no push subscription: a due reminder
       that cannot actually reach the phone is the whole complaint. */
    .un-panel-notify{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        gap:8px;
        padding:9px 14px;
        border-radius:12px;
        border:1px solid rgba(255,255,255,.15);
        background:rgba(255,255,255,.06);
        color:#e7e9f3;
        font-family:'Montserrat',system-ui,sans-serif;
        font-size:12px;
        font-weight:700;
        cursor:pointer;
        transition:background .22s, border-color .22s, color .22s;
    }
    .un-panel-notify svg{ width:15px; height:15px; }
    .un-panel-notify[hidden]{ display:none; }
    .un-panel-notify:hover{
        background:rgba(255,255,255,.12);
        border-color:rgba(255,140,66,.55);
        color:#fff;
    }
    .un-panel-notify:disabled{ opacity:.6; cursor:default; }
    @media (max-width:820px){
        .un-panel-list{ max-height:38vh; }
        .un-bell{ width:44px; height:44px; }
        /* This rule block sits after _navbar.html's, so it has to repeat the
           navbar's phone size or the bell would grow in the ☰ row. */
        .un-bell.in-nav{ width:40px; height:40px; }
    }
    @media (prefers-reduced-motion:reduce){
        .un-bell-count,
        .un-panel-in{ animation:none; }
        .un-row:hover{ transform:none; }
    }
</style>

<div class="un-dock" id="unDock" hidden>
    <button type="button" class="un-bell" id="unBell"
            aria-label="Your reminders" aria-expanded="false" aria-controls="unPanel">
        <svg class="un-svg-bell" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M12 2.6a5.4 5.4 0 0 0-5.4 5.4v3.1L4.9 14a1.3 1.3 0 0 0 1.1 2h12a1.3 1.3 0 0 0 1.1-2l-1.7-2.9V8A5.4 5.4 0 0 0 12 2.6Z"/>
            <path fill="currentColor" d="M9.4 17.6a2.6 2.6 0 0 0 5.2 0H9.4Z"/>
        </svg>
        <span class="un-bell-count" id="unBellCount" hidden>0</span>
    </button>

    <aside class="un-panel" id="unPanel" hidden aria-label="Your reminders">
        <div class="un-panel-head">
            <span class="un-panel-title" id="unPanelTitle">It's about time</span>
            <button type="button" class="un-panel-x" id="unPanelX" aria-label="Collapse">&times;</button>
        </div>
        <div class="un-panel-list" id="unPanelList"></div>
        <div class="un-panel-foot">
            <button type="button" class="un-panel-notify" id="unPanelNotify" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path fill="currentColor" d="M12 2.6a5.4 5.4 0 0 0-5.4 5.4v3.1L4.9 14a1.3 1.3 0 0 0 1.1 2h12a1.3 1.3 0 0 0 1.1-2l-1.7-2.9V8A5.4 5.4 0 0 0 12 2.6Z"/>
                    <path fill="currentColor" d="M9.4 17.6a2.6 2.6 0 0 0 5.2 0H9.4Z"/>
                </svg>
                Turn on notifications
            </button>
            <a class="un-panel-all" href="{{ url_for('up_next.page') }}">
                Open queue
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path fill="currentColor" d="M13.2 4.6 20.6 12l-7.4 7.4-1.7-1.7 4.5-4.5H3.4v-2.4h12.6l-4.5-4.5 1.7-1.7Z"/>
                </svg>
            </a>
        </div>
    </aside>
</div>

<script>
(function () {
    "use strict";

    var dock = document.getElementById("unDock");
    if (!dock || window.__UN_DOCK_WIRED) return;

    var POLL_MS = 60000;
    var SEEN_KEY = "unDockSeen";
    var bell = document.getElementById("unBell");
    var badge = document.getElementById("unBellCount");
    var panel = document.getElementById("unPanel");
    var titleEl = document.getElementById("unPanelTitle");
    var listEl = document.getElementById("unPanelList");
    var xEl = document.getElementById("unPanelX");
    var notifyEl = document.getElementById("unPanelNotify");
    var seen = [];          // slugs the user has already been shown this session
    var manualOpen = false; // the user opened it themselves — leave it open
    var open = false;
    var hasAny = false;     // anything armed or due at all
    var last = null;        // last alerts payload, so the badge can be repainted
    var timer = null;

    // The queue page renders its own "while you were away" card with live data
    // in the HTML, so the box stays quiet there rather than reporting the same
    // reminder twice — the bell still works, it just waits to be asked. The
    // homepage has no such card: there the box *is* the notification, and it
    // comes straight in instead of after a lesser strip saying the same thing.
    var hasAwayCard = !!document.getElementById("unAway");

    /* -------------------- place the bell in the navbar ------------------- */
    /* _navbar.html leaves an empty #unNavSlot next to the profile pill; the
       button goes there so it is navbar chrome (and stays visible on phones,
       where .nav-right is hidden inside the ☰ drawer). */
    var slot = document.getElementById("unNavSlot");
    if (slot && bell && slot.parentNode) {
        slot.parentNode.insertBefore(bell, slot);
        slot.remove();
        dock.classList.add("with-nav");
        bell.classList.add("in-nav");
    }
    // Nothing to report until the first payload lands, so the bell starts out
    // of the way rather than flashing an empty button into the header.
    if (bell) bell.hidden = true;
    /* The panel hangs under the navbar. Measured rather than guessed: the
       navbar wraps to a second row between 820px and 1150px. */
    function syncPanelTop() {
        var nav = document.querySelector(".main-nav");
        if (!nav) return;
        var bottom = nav.getBoundingClientRect().bottom;
        if (bottom > 0) dock.style.setProperty("--un-panel-top", Math.round(bottom + 12) + "px");
    }
    syncPanelTop();
    window.addEventListener("resize", syncPanelTop);
    window.addEventListener("load", syncPanelTop);

    try {
        seen = JSON.parse(sessionStorage.getItem(SEEN_KEY) || "[]") || [];
    } catch (err) { seen = []; }
    if (!seen.length) seen = [];

    function escapeHtml(s) {
        var d = document.createElement("div");
        d.textContent = s == null ? "" : String(s);
        return d.innerHTML;
    }

    /* Nothing to report — no reminders, or the request failed: no box, and no
     * bell either. The bell lives in the navbar on most pages now, so hiding
     * this wrapper is not enough to take it off the screen. */
    function hideDock() {
        hasAny = false;
        setOpen(false);
        dock.hidden = true;
    }

    /* Session-scoped "already shown": sessionStorage survives navigation
     * within the tab, so a reminder the user has looked at stops counting as
     * unread on the next page instead of nagging for the rest of the day. */
    function markSeen(slugs) {
        var changed = false;
        (slugs || []).forEach(function (s) {
            if (s && seen.indexOf(s) === -1) { seen.push(s); changed = true; }
        });
        if (!changed) return false;
        try { sessionStorage.setItem(SEEN_KEY, JSON.stringify(seen.slice(-60))); } catch (err) {}
        return true;
    }

    function unreadDue() {
        var due = (last && last.items) || [];
        return due.filter(function (i) { return seen.indexOf(i.slug) === -1; });
    }

    /* The badge is the *unread* count, not every due reminder: a number that
     * never clears tells the user nothing ("still unread?" is exactly the
     * complaint). The quiet dot stays for "something is armed but nothing is
     * calling yet". */
    function paintBadge() {
        if (!badge) return;
        var unread = unreadDue().length;
        var soonCount = (last && last.upcoming_count) || 0;
        if (unread) {
            badge.hidden = false;
            badge.classList.remove("quiet");
            badge.textContent = unread > 9 ? "9+" : String(unread);
        } else if (soonCount) {
            badge.hidden = false;
            badge.classList.add("quiet");
            badge.textContent = "";
        } else {
            badge.hidden = true;
        }
    }

    function setOpen(want) {
        want = !!want;
        // Applied every time, not only on a change: what is on screen must
        // never depend on what the last poll happened to do.
        panel.hidden = !want;
        if (bell) {
            // The bell stays put while the box is open — it is the thing that
            // opens the box, and on most pages it is header chrome. Hiding it
            // is what made the logo disappear the moment the user clicked it.
            bell.hidden = !hasAny;
            bell.setAttribute("aria-expanded", want ? "true" : "false");
        }
        if (want) {
            syncPanelTop();
            // Seeing the box is seeing the notifications: what it is showing is
            // no longer unread. This is what stops the badge from still
            // claiming "1" after the user has looked at it.
            if (markSeen(dueSlugsOnScreen()) && last) paintBadge();
        }
        if (want === open) return;
        open = want;
        if (want) {
            panel.classList.remove("un-panel-in");
            void panel.offsetWidth;  // restart the entry animation
            panel.classList.add("un-panel-in");
        }
    }

    // One wide row per notification: the show's thumbnail and name link to the
    // show (so the box leads somewhere instead of only informing) and the ✓
    // retires the reminder. `data-due` is what the ✕ reads back to remember
    // what it collapsed.
    function rowHtml(item, isDue) {
        var note = isDue
            ? (item.ago ? "ready — came due " + item.ago : (item.caption || "ready now"))
            : (item.caption || "reminder set");
        var pill = isDue ? "READY" : ((item.pill && item.pill.label) || "");
        var thumb = item.image
            ? '<img src="' + escapeHtml(item.image) + '" alt="" loading="lazy" decoding="async">'
            : '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
              '<path fill="currentColor" d="M3 5.5h18V18H3V5.5Zm2 2V16h14V7.5H5Zm3.2 11.9h7.6l.9 2.1H7.3l.9-2.1Z"/></svg>';
        var cls = "un-row" + (isDue ? " ready" : "") + (item.fresh ? " fresh" : "");
        return '<div class="' + cls + '"' +
            (isDue ? ' data-due="1"' : '') +
            (item.fresh ? ' data-fresh="1"' : '') +
            ' data-slug="' + escapeHtml(item.slug) + '">' +
            '<a class="un-row-main" href="/anime/' + encodeURIComponent(item.slug) + '">' +
            '<span class="un-row-thumb">' + thumb + '</span>' +
            '<span class="un-row-text">' +
            '<strong>' + escapeHtml(item.title) + '</strong>' +
            '<span>' + escapeHtml(note) + '</span>' +
            '</span>' +
            '</a>' +
            (pill ? '<span class="un-row-pill ' + (isDue ? "ready" : "soon") + '">' +
                    escapeHtml(pill) + '</span>' : '') +
            (isDue ?
                '<button type="button" class="un-row-ack" data-ack="1"' +
                ' title="Got it — I\u2019ll watch it, stop the reminder"' +
                ' aria-label="Got it, keep it on the queue">' +
                '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
                '<path fill="currentColor" d="M9.6 16.2 4.8 11.4l1.4-1.4 3.4 3.4 7.2-7.2 1.4 1.4-8.6 8.6Z"/>' +
                '</svg></button>' : '') +
            '</div>';
    }

    function dueSlugsOnScreen() {
        return [].map.call(listEl.querySelectorAll(".un-row[data-due]"), function (a) {
            return a.getAttribute("data-slug");
        });
    }

    function render(data) {
        last = data || {};
        var due = last.items || [];
        var soon = last.upcoming || [];
        var dueCount = last.count || 0;
        var soonCount = last.upcoming_count || 0;

        hasAny = dueCount > 0 || soonCount > 0;
        if (!hasAny) {
            hideDock();
            return;
        }

        dock.hidden = false;

        // Badge: how many the user has not been shown yet, or a quiet dot when
        // only armed. Every due reminder is still listed in the box either way.
        paintBadge();
        if (bell) {
            bell.setAttribute("aria-label", dueCount
                ? dueCount + " reminder" + (dueCount === 1 ? "" : "s") + " ready"
                : "Your reminders");
        }
        if (titleEl) {
            titleEl.textContent = dueCount > 1
                ? dueCount + " shows are ready"
                : (dueCount === 1 ? "It's about time" : "Your reminders");
        }

        if (listEl) {
            var html = "";
            if (due.length) {
                if (soon.length) html += '<div class="un-group">Ready now</div>';
                html += due.map(function (i) { return rowHtml(i, true); }).join("");
            }
            if (soon.length) {
                html += '<div class="un-group">Coming up</div>';
                html += soon.map(function (i) { return rowHtml(i, false); }).join("");
            }
            // Say so when the server had more than the panel lists — the tail
            // of a long queue must not look like the whole of it.
            var hidden = Math.max(0, dueCount - due.length) + Math.max(0, soonCount - soon.length);
            if (hidden > 0) {
                html += '<a class="un-more" href="/up-next">' + hidden +
                    ' more in Up Next &rsaquo;</a>';
            }
            listEl.innerHTML = html;
        }

        // Only the reminder that *just* went off opens the box by itself. A
        // stale one popping the box open over the page is what reads as being
        // nagged and out of place; the bell and its unread count already say
        // something is waiting, and one click shows the whole list. The queue
        // page's own "while you were away" card keeps the box quiet there.
        var justFired = due.some(function (i) {
            return i.fresh && seen.indexOf(i.slug) === -1;
        });
        setOpen(manualOpen || (justFired && !hasAwayCard));
    }

    function load() {
        if (document.hidden) return;
        fetch("/api/up-next/alerts", { credentials: "same-origin" })
            .then(function (res) {
                // 401 = signed out. fetch follows no API redirect, so a
                // visitor reading a public page is never bounced to /login.
                if (!res.ok) throw new Error("http " + res.status);
                return res.json();
            })
            .then(function (data) {
                if (!data || !data.success) throw new Error("bad payload");
                render(data);
            })
            .catch(function () { hideDock(); });
    }

    // A due reminder that cannot reach this device is the most common reason
    // someone sees no notification at all, so offer the fix when there is no
    // subscription. The subscribe flow lives in up_next.js, which this page
    // may not load — the button only appears where it can actually work.
    function offerNotify() {
        var api = window.__UN;
        if (!notifyEl || !api || !api.pushSupported || !api.pushSupported()) return;
        if (!window.isSecureContext) return;
        if (("Notification" in window) && Notification.permission === "denied") return;
        navigator.serviceWorker.ready
            .then(function (reg) { return reg.pushManager.getSubscription(); })
            .then(function (sub) { notifyEl.hidden = !!sub; })
            .catch(function () { /* no service worker yet: leave it hidden */ });
    }

    if (bell) {
        bell.addEventListener("click", function (e) {
            e.stopPropagation();
            manualOpen = !open;
            setOpen(manualOpen);
        });
    }

    /* ✕ / Escape: the user has seen this, so it stops counting as unread. The
     * reminder itself stays pending on the queue until it is watched or the ✓
     * retires it; only the badge goes quiet. Shared by ✕ and Escape so both
     * mean "I have seen this one" instead of the box flickering back on the
     * next poll. (Private mode just means it is forgotten on reload.) */
    function dismiss() {
        markSeen(dueSlugsOnScreen());
        if (last) paintBadge();
        manualOpen = false;
        setOpen(false);
    }

    if (xEl) xEl.addEventListener("click", dismiss);

    /* The ✓ on a row: "yes, I got it, I'll watch this show". Clears the
     * reminder on the server — the timer goes off, the badge drops, the row
     * leaves the box — while the show stays on the queue, so /up-next still
     * lists it for anyone who missed the notification. */
    var acking = {};
    function ack(slug, btn) {
        if (!slug || acking[slug]) return;
        acking[slug] = true;
        if (btn) btn.disabled = true;
        markSeen([slug]);
        fetch("/api/up-next/ack", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ slug: slug }),
        })
            .then(function (res) {
                if (!res.ok) throw new Error("http " + res.status);
                return res.json();
            })
            .then(function () {
                delete acking[slug];
                load();  // server-side the reminder is gone: re-read the box
            })
            .catch(function () {
                delete acking[slug];
                if (btn) btn.disabled = false;
            });
    }

    if (listEl) {
        listEl.addEventListener("click", function (e) {
            var btn = e.target && e.target.closest
                ? e.target.closest(".un-row-ack") : null;
            if (!btn) return;
            e.preventDefault();
            e.stopPropagation();
            var row = btn.closest(".un-row");
            ack(row ? row.getAttribute("data-slug") : null, btn);
        });
    }

    if (notifyEl) {
        notifyEl.addEventListener("click", function () {
            var api = window.__UN;
            if (!api || !api.enablePush) return;
            notifyEl.disabled = true;
            api.enablePush().then(function (ok) {
                notifyEl.disabled = false;
                if (ok) notifyEl.hidden = true;
            });
        });
    }

    // A box the user opened with the bell is a drop-down: clicking anywhere
    // else closes it, except on the bell itself, which owns its own toggle. A
    // box the site opened because a reminder came due is not a menu — it is the
    // notification, so clicking the page under it must not wipe the row off the
    // screen (that is exactly what made the row "vanish" the moment the user
    // looked at anything). Only ✕ or Escape retires that one.
    document.addEventListener("click", function (e) {
        if (!open || !manualOpen) return;
        if (dock.contains(e.target)) return;
        if (bell && bell.contains(e.target)) return;
        manualOpen = false;
        setOpen(false);
    });
    document.addEventListener("keydown", function (e) {
        if (e.key !== "Escape" || !open) return;
        if (manualOpen) {
            manualOpen = false;
            setOpen(false);
        } else {
            dismiss();
        }
    });

    function startPolling() {
        if (timer) return;
        timer = setInterval(load, POLL_MS);
    }

    // A timer that ran out while the user was reading another page should
    // surface the moment they come back, without a reload.
    document.addEventListener("visibilitychange", function () {
        if (document.hidden) return;
        syncPanelTop();
        load();
        startPolling();
    });

    load();
    startPolling();

    // The push helpers arrive with up_next.js (deferred), so check once the
    // page has finished loading rather than at parse time.
    window.addEventListener("load", offerNotify);
})();
</script>
