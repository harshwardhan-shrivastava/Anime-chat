<!-- ================= APK DOWNLOAD BANNER (Android mobile only) =================
     Bottom-sheet prompt offering the standalone Otakul APK. Appears on
     Android phones a few seconds after load, sits above the mobile tab bar,
     and never shows inside the installed app itself. Dismissals are
     remembered for a week (localStorage). The APK itself lives at
     static/apk/otakul.apk and is served from /static/apk/otakul.apk. -->
<style>
    #otakulApkBanner {
        position: fixed;
        left: 50%;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
        transform: translate(-50%, 130%);
        width: calc(100% - 24px);
        max-width: 520px;
        z-index: 1300;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(13, 17, 23, 0.96);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
        font-family: 'Montserrat', system-ui, sans-serif;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #otakulApkBanner.is-visible {
        opacity: 1;
        transform: translate(-50%, 0);
        pointer-events: auto;
    }
    #otakulApkBanner .apk-icon {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        flex: 0 0 auto;
        box-shadow: 0 4px 14px rgba(34, 197, 94, 0.35);
    }
    #otakulApkBanner .apk-body {
        flex: 1 1 auto;
        min-width: 0;
    }
    #otakulApkBanner .apk-title {
        color: #f1f5f9;
        font-size: 0.92rem;
        font-weight: 800;
        line-height: 1.3;
        margin: 0;
    }
    #otakulApkBanner .apk-sub {
        color: #94a3b8;
        font-size: 0.78rem;
        line-height: 1.45;
        margin: 3px 0 0;
    }
    #otakulApkBanner .apk-actions {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    #otakulApkBanner .apk-dl {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 10px 16px;
        border-radius: 999px;
        border: none;
        background: linear-gradient(135deg, #22c55e, #059669);
        color: #fff;
        font-size: 0.8rem;
        font-weight: 800;
        font-family: 'Montserrat', system-ui, sans-serif;
        text-decoration: none;
        white-space: nowrap;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(34, 197, 94, 0.35);
        transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
    }
    #otakulApkBanner .apk-dl:hover {
        transform: translateY(-1px);
        filter: brightness(1.08);
        box-shadow: 0 10px 24px rgba(34, 197, 94, 0.45);
    }
    #otakulApkBanner .apk-close {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        color: #94a3b8;
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s, color 0.2s;
    }
    #otakulApkBanner .apk-close:hover {
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
    }
    @media (max-width: 420px) {
        #otakulApkBanner .apk-sub {
            display: none;
        }
        #otakulApkBanner .apk-dl {
            padding: 10px 12px;
        }
    }
</style>

<div id="otakulApkBanner" role="dialog" aria-label="Download the Otakul app">
    <img class="apk-icon" src="/static/icons/icon-192.png" alt="" width="46" height="46">
    <div class="apk-body">
        <p class="apk-title">Get the Otakul App</p>
        <p class="apk-sub">Reviews, threads &amp; your community — one tap away.</p>
    </div>
    <div class="apk-actions">
        <a class="apk-dl" id="otakulApkDownload" href="/static/apk/otakul.apk" download="Otakul.apk">
            <i class="fas fa-download" aria-hidden="true"></i>
            Download APK
        </a>
        <button type="button" class="apk-close" id="otakulApkClose" aria-label="Dismiss">
            <i class="fas fa-xmark" aria-hidden="true"></i>
        </button>
    </div>
</div>

<script>
(function () {
    "use strict";
    try {
        if (window.__otakulApkWired) return;
        // Already running inside the installed app (TWA / Add to Home Screen)?
        if (window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true) return;
        // The APK is Android-only.
        if (!/Android/i.test(navigator.userAgent)) return;
        var banner = document.getElementById("otakulApkBanner");
        if (!banner) return;
        window.__otakulApkWired = true;

        var KEY = "otakul_apk_prompt";
        var WEEK = 7 * 24 * 60 * 60 * 1000;
        try {
            var last = parseInt(localStorage.getItem(KEY) || "0", 10);
            if (last && Date.now() - last < WEEK) return;
        } catch (e) { /* localStorage unavailable — still show */ }

        function remember() {
            try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {}
        }
        function hide() {
            banner.classList.remove("is-visible");
            setTimeout(function () { banner.remove(); }, 400);
        }

        var close = document.getElementById("otakulApkClose");
        var dl = document.getElementById("otakulApkDownload");
        if (close) close.addEventListener("click", function () { remember(); hide(); });
        if (dl) dl.addEventListener("click", function () { remember(); });

        // Sit above the mobile bottom tab bar when one is on the page.
        var tabbar = document.querySelector(".mob-tabbar");
        if (tabbar) {
            banner.style.bottom = (tabbar.offsetHeight + 12) + "px";
        }

        // Slide in a few seconds after the page settles.
        setTimeout(function () { banner.classList.add("is-visible"); }, 3500);
    } catch (err) { /* never let the banner break the page */ }
})();
</script>
