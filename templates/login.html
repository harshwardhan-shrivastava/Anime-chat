<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | AnimeChat</title>

    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/6c5c3d9d54.js" crossorigin="anonymous"></script>
</head>
<body class="auth-body">

<div class="background">
    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>
</div>

<div class="auth-wrapper">

    <a href="{{ url_for('home') }}" class="auth-brand">
        <span class="brand-anime">Anime</span><span class="brand-chat">Chat</span>
    </a>

    <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="auth-subtitle">Log in to chat in your anime communities.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="flash-list">
                {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">

            <input type="hidden" name="next" value="{{ next or '' }}">

            <div class="auth-field">
                <label for="identifier">Username or email</label>
                <input type="text" id="identifier" name="identifier" placeholder="you@example.com"
                       value="{{ identifier or '' }}" required>
            </div>

            <div class="auth-field">
                <label for="password">Password</label>
                <div class="password-wrap">
                    <input type="password" id="password" name="password" placeholder="Your password" required>
                    <button type="button" class="pw-toggle" aria-label="Show password"><i class="fas fa-eye"></i></button>
                </div>
            </div>

            <button type="submit" class="auth-submit">Log in</button>

        </form>

        <div class="auth-switch">
            <a href="{{ url_for('auth.forgot_password') }}" class="forgot-link">Forgot your password?</a>
        </div>

        <div class="auth-switch">
            New here? <a href="{{ url_for('auth.signup') }}">Create an account</a>
        </div>
    </div>
</div>

<script>
(function () {
    document.querySelectorAll(".pw-toggle").forEach(function (btn) {
        btn.addEventListener("click", function () {
            var input = btn.parentElement.querySelector("input");
            var show = input.type === "password";
            input.type = show ? "text" : "password";
            btn.innerHTML = show ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
            btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
        });
    });
})();
</script>

</body>
</html>
