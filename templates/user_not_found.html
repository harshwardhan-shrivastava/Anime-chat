<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User not found — Otakul</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></noscript>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20260902z4">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}?v=20260902s">
    <style>
        .unf-wrap {
            max-width: 520px;
            margin: 80px auto 0;
            padding: 48px 40px;
            text-align: center;
            background: linear-gradient(135deg, rgba(43, 16, 85, 0.45), rgba(18, 20, 31, 0.55));
            border: 1px solid rgba(139, 92, 246, 0.25);
            border-radius: 20px;
        }
        .unf-icon {
            font-size: 2.6rem;
            color: #8b5cf6;
            margin-bottom: 14px;
        }
        .unf-wrap h1 {
            margin: 0 0 10px;
            font-size: 1.4rem;
            color: #fff;
        }
        .unf-wrap p {
            margin: 0 0 24px;
            color: #9aa2bd;
            font-size: 0.92rem;
            line-height: 1.6;
        }
        .unf-wrap code {
            color: #c4b5fd;
            background: rgba(139, 92, 246, 0.12);
            border-radius: 6px;
            padding: 2px 8px;
        }
        .unf-btn {
            display: inline-block;
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            background: linear-gradient(135deg, #6d28d9, #8b5cf6);
            border-radius: 10px;
            padding: 11px 22px;
        }
        .unf-btn:hover { filter: brightness(1.1); }
    </style>
</head>
<body>
    {% include '_navbar.html' %}

    <main>
        <div class="unf-wrap">
            <div class="unf-icon"><i class="fas fa-user-slash"></i></div>
            <h1>User not found</h1>
            <p>
                No user named <code>{{ username }}</code> exists{% if requested_path %} in this
                {{ requested_path }} view{% endif %}.<br>
                The link may be old, or the username was typed with different
                capitalization than the real account.
            </p>
            <a class="unf-btn" href="{{ url_for('reviews_page') }}"><i class="fas fa-comments"></i> Browse reviews</a>
        </div>
    </main>

{% include "_footer.html" %}

</body>
</html>
