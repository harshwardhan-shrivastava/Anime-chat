<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Otakul</title>

    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/6c5c3d9d54.js" crossorigin="anonymous"></script>
</head>
<body class="auth-body">

<div class="background">
    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>
</div>

<div class="auth-wrapper">

    <a href="{{ url_for('home') }}" class="auth-brand">
        <span class="brand-anime">Ota</span><span class="brand-chat">kul</span>
    </a>

    <div class="auth-card">
        <h1>Reset your password</h1>
        <p class="auth-subtitle">Enter your registered email and we'll send you a 6-digit code.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="flash-list">
                {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.forgot_password') }}">

            <div class="auth-field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <button type="submit" class="auth-submit">Send verification code</button>

        </form>

        <div class="auth-switch">
            <a href="{{ url_for('auth.login') }}">Back to login</a>
        </div>
    </div>
</div>

</body>
</html>
